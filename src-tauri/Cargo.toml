[package]
name = "stage-backup"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Simple macOS-first backups for live production systems"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
avantis-protocol = { path = "../crates/avantis-protocol" }
if-addrs = "0.15"
keyring = { version = "4.2", default-features = false, features = ["v1", "apple-native-keyring-store"] }
mdns-sd = "0.21"
rosc = "0.11.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
ureq = { version = "2", features = ["json"] }
