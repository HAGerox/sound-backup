[package]
name = "stage-backup"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Simple macOS-first backups for live production systems"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
avantis-protocol = { path = "../crates/avantis-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
